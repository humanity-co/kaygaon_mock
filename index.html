<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kaygaon Paper Mills — Management Dashboard (Demo)</title>
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="app.css">
  </head>
  <body>
    <div class="page" id="top">
      <header class="x-top">
        <p class="x-logo"><b>KAYGAON PAPER MILLS PVT LTD</b> · Mill at a glance</p>
        <div class="x-ctl">
          <span>11 Oct 2026 · Data as of 10:30 IST</span>
          <label>Period
            <select data-sel="period">
              <option value="today">Today</option>
              <option value="mtd">MTD</option>
              <option value="ytd">YTD</option>
            </select>
          </label>
          <button type="button" data-act="phone">Phone view</button>
          <button type="button" data-act="tv">TV mode</button>
          <button type="button" data-act="print">Print</button>
        </div>
      </header>
      <div class="x-app">
        <nav class="x-side" aria-label="Screens">
          <p class="x-grp">Operations</p>
          <button data-go="dash"><svg class="x-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>MD Dashboard</button>
          <button data-go="map"><svg class="x-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15"/></svg>Mill Map</button>
          <button data-go="gate"><svg class="x-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 6h11v10H2zM13 10h4l3 3v3h-7"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>Gate Entry</button>
          <button data-go="qc"><svg class="x-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2h12.4a1.5 1.5 0 0 0 1.3-2L14 9V3M7 15h10"/></svg>QC</button>
          <button data-go="grn"><svg class="x-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h9l4 4v16H6zM14 2v5h5M9 12h7M9 16h7"/></svg>GRN &amp; Bills</button>
          <button data-go="journey"><svg class="x-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h8.5a3.5 3.5 0 0 0 0-7h-9a3.5 3.5 0 0 1 0-7H16"/></svg>Truck Journey</button>
          <button data-go="yard"><svg class="x-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="13" rx="1.5"/></svg>Truck Yard</button>
          <button data-go="imp"><svg class="x-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 15h18l-2 5H5zM6 15V9h12v6M9 9V5h6v4"/></svg>Import Shipment</button>
          <p class="x-grp">MD Desk</p>
          <button data-go="brief"><svg class="x-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Morning Briefing</button>
          <button data-go="inbox"><svg class="x-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13l3-8h12l3 8v6H3zM3 13h5l1 3h6l1-3h5"/></svg>Decision Inbox</button>
          <button data-go="commit"><svg class="x-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 2v4M16 2v4M8 13l3 3 5-6"/></svg>Commitments</button>
          <button data-go="ask"><svg class="x-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>Ask Kaygaon</button>
        </nav>
        <main class="main" id="view" aria-live="polite"></main>
      </div>
      <footer class="foot">
        <p>Demo with sample data. DataMan ERP stays unchanged — the app only reads its Excel reports.</p>
        <p>Built by PRAVAHAx</p>
      </footer>
    </div>
    <div class="x-ovl" id="ovl" tabindex="-1" hidden></div>
    <div class="x-toast" id="toast" role="status"></div>
    <script src="ui.js"></script>
    <script src="app.js"></script>
  </body>
</html>
